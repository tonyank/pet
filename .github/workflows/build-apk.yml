name: Build and Sign Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择构建类型 (release / debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          mkdir -p app/build
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/build/release.keystore
            echo "Keystore decoded successfully"
          else
            echo "Warning: KEYSTORE_BASE64 secret not set, will fall back to debug signing"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build APK with Gradle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in app/build/outputs/apk"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dianping-${{ github.event.inputs.build_type }}-signed-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
